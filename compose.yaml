name: yourhome

services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=tcp --host=127.0.0.1
          --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute='SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  wordpress:
    image: wordpress:7.1.2-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/themes/yourhome:/var/www/html/wp-content/themes/yourhome:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$context = stream_context_create(["http" => ["timeout" => 3]]);
          exit(false === @file_get_contents("http://127.0.0.1/wp-login.php", false, $$context) ? 1 : 0);'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  backend:

volumes:
  db_data:
  wordpress_data:
